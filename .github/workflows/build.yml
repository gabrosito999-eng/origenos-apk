name: 5VpulseOS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install deps + AIDL
      run: |
        sudo apt update
        sudo apt install -y python3-pip zip unzip git openjdk-17-jdk
        pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    - name: Setup SDK + Build Tools 34
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip && mv cmdline-tools latest
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        buildozer -v android debug
      timeout-minutes: 30
    - uses: actions/upload-artifact@v4
      with:
        name: 5VpulseOS-APK
        path: bin/*.apk
